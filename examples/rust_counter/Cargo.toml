[package]
name = "rust_counter"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
# `futures-stream` gives `StreamReader::into_stream`, so the two click streams can be
# merged with `futures_util::stream::select`.
wit-bindgen = { version = "0.61.1", features = ["futures-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
